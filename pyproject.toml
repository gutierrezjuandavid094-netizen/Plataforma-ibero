[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "campus-flow-ibero"
version = "3.0.0"
description = "Asistente académico de escritorio para Moodle y Microsoft Teams"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "Juan David Gutierrez"}]
dependencies = [
  "PyQt6>=6.7,<7",
  "requests>=2.32,<3",
  "keyring>=25,<26",
]

[project.optional-dependencies]
build = ["pyinstaller>=6.10,<7"]
test = ["pytest>=8,<10", "pytest-cov>=5,<8"]

[project.scripts]
campus-flow = "src.app:main"

[tool.setuptools]
packages = ["src", "src.services", "src.ui", "src.utils"]

[tool.setuptools.package-data]
src = ["assets/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
